<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OnyXLuxe Tickets - Your premier destination for event tickets. Discover and purchase tickets for concerts, shows, and more."
    />
    <title>OnyXLuxe Tickets</title>
    <link rel="stylesheet" href="Homepage.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="Header">
      <a href="#" class="logo">OnyXLuxe</a>
      <div class="header-right">
        <a href="index.html" class="active">HOME</a>
        <a href="#target">TICKETS</a>
        <a href="contact.html">CONTACTS</a>
      </div>
    </div>

    <section class="welcome-banner-section">
      <img src="IMG3.png" alt="Welcome Banner" class="welcome-banner-image" />
    </section>

    <section class="ticket-previews-container">
      <h2 id="target">Available Tickets</h2>
      <p class="event-list-intro">
        Browse event details, compare ticket prices and continue as a guest.
      </p>
    </section>

    <dialog class="event-preview-dialog" aria-labelledby="preview-title">
      <article class="event-preview-card">
        <button
          class="preview-close-button"
          type="button"
          aria-label="Close event details"
        >
          &times;
        </button>
        <img class="preview-banner" src="" alt="" />
        <div class="preview-content">
          <p class="preview-eyebrow">EVENT DETAILS</p>
          <h2 id="preview-title"></h2>
          <p class="preview-description"></p>
          <dl class="preview-facts">
            <div>
              <dt>Date</dt>
              <dd class="preview-date"></dd>
            </div>
            <div>
              <dt>Time</dt>
              <dd class="preview-time"></dd>
            </div>
            <div>
              <dt>Location</dt>
              <dd class="preview-location"></dd>
            </div>
            <div>
              <dt>Presented by</dt>
              <dd class="preview-host"></dd>
            </div>
          </dl>
          <div class="preview-purchase-row">
            <p class="preview-price">
              <span>Ticket price</span>
              <strong><small>/ person</small></strong>
            </p>
            <button class="preview-buy-button" type="button">
              Buy Ticket
            </button>
          </div>
        </div>
      </article>
    </dialog>

          ></a>
          <a href="https://wa.me/2349044031130" target="_blank"
            ><i class="bx bxl-whatsapp" aria-label="WhatsApp"></i
          ></a>
          <a
            href="https://www.linkedin.com/in/balsit-adedayo-2b34b325a/?trk=opento_sprofile_topcard"
            target="_blank"
            ><i class="bx bxl-linkedin" aria-label="LinkedIn"></i
          ></a>
          <a href="https://github.com/RILEYSIN" target="_blank"
            ><i class="bx bxl-github" aria-label="GitHub"></i
          ></a>
        </div>
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="#">About</a>
          <a href="contact.html">Contact Us</a>
        </div>
        <p class="footer-copyright">
          &copy; 2025 OnyXLuxe. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="events.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
