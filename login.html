<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Login to OnyXLuxe Tickets - Access your account to manage bookings and preferences."
    />
    <title>Login - OnyXLuxe Tickets</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="wrapper">
      <div class="auth-card">
        <header class="form-header">
          <h2>ONYXLUXE</h2>
          <h1>Login</h1>
          <p>Welcome back! Please sign in.</p>
        </header>

        <form class="login-form">
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>

        <footer class="form-footer">
          <p>
            <a href="mailto:balsitoyosi07@gmail.com">Need help signing in?</a>
          </p>
          <p>
            Don't have an account? <a href="Signup.html">Sign up here</a>
          </p>
          <a class="guest-link" href="index.html">Continue as guest</a>
        </footer>
      </div>
    </main>
    <script>
      document
        .querySelector(".login-form")
        .addEventListener("submit", function (event) {
          // For testing, just redirect to main page
          window.location.href = "index.html";
          event.preventDefault();
        });
    </script>
  </body>
</html>
