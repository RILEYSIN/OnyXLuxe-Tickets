<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Choose a new password for your OnyXLuxe Tickets account."
    />
    <title>Reset Password - OnyXLuxe Tickets</title>
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="mobile-nav.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="Header">
      <a href="index.html" class="logo">OnyXLuxe</a>
      <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="site-navigation" aria-expanded="false" data-menu-toggle>
        <span></span><span></span><span></span>
      </button>
      <nav class="header-right" id="site-navigation" aria-label="Main navigation" data-menu>
        <a href="index.html">HOME</a>
        <a href="index.html#target">TICKETS</a>
        <a href="contact.html">CONTACT</a>
        <a href="login.html" data-auth-guest>SIGN IN</a>
        <a href="signup.html" data-auth-guest>SIGN UP</a>
        <span class="auth-nav-status" data-auth-status role="status" aria-live="polite" hidden></span>
        <a href="#" data-auth-logout hidden>LOG OUT</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-heading">
        <p class="auth-eyebrow">ACCOUNT HELP</p>
        <h1 id="auth-heading">Choose a new password</h1>
        <p class="auth-intro">
          Enter your new password twice to confirm it.
        </p>
        <form class="auth-form" data-auth-form="update-password">
          <div class="form-field">
            <label for="password">New password</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                required
                data-password-label="password"
                placeholder="Create a new password"
              />
              <button
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-controls="password"
                aria-pressed="false"
              >
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                  <path
                    d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"
                  />
                </svg>
              </button>
            </div>
            <small>Use at least 8 characters.</small>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirm new password</label>
            <div class="password-field">
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                required
                data-password-label="password confirmation"
                placeholder="Enter your new password again"
              />
              <button
                class="password-toggle"
                type="button"
                aria-label="Show password confirmation"
                aria-controls="confirm-password"
                aria-pressed="false"
              >
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                  <path
                    d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"
                  />
                </svg>
              </button>
            </div>
            <small>Enter the same password again to confirm it.</small>
          </div>

          <button type="submit">Update password</button>
          <p class="form-feedback" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">
          <a href="forgot-password.html">Request another reset link</a>
        </p>
      </section>
    </main>

    <footer class="auth-footer">
      <a href="mailto:balsitoyosi07@gmail.com">Contact OnyXLuxe support</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="site-auth.js"></script>
    <script src="mobile-nav.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
