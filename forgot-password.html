<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get help recovering access to your OnyXLuxe Tickets account."
    />
    <title>Forgot Password - OnyXLuxe Tickets</title>
    <link rel="stylesheet" href="auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="Header">
      <a href="index.html" class="logo">OnyXLuxe</a>
      <nav class="header-right" aria-label="Main navigation">
        <a href="index.html">HOME</a>
        <a href="index.html#target">TICKETS</a>
        <a href="contact.html">CONTACT</a>
        <a href="login.html" class="active" aria-current="page" data-auth-guest>SIGN IN</a>
        <a href="signup.html" data-auth-guest>SIGN UP</a>
        <span class="auth-nav-status" data-auth-status role="status" aria-live="polite" hidden></span>
        <a href="#" data-auth-logout hidden>LOG OUT</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="auth-heading">
        <p class="auth-eyebrow">ACCOUNT HELP</p>
        <h1 id="auth-heading">Forgot your password?</h1>
        <p class="auth-intro">
          Enter the email address associated with your account.
        </p>
        <p class="auth-notice">
          We’ll send you a secure password-reset link if an account exists for
          that address.
        </p>

        <form class="auth-form" data-auth-form="reset">
          <div class="form-field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              maxlength="254"
              required
              placeholder="you@example.com"
            />
          </div>
          <button type="submit">Request password reset</button>
          <p class="form-feedback" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          Remembered it? <a href="login.html">Back to sign in</a>
        </p>
      </section>
    </main>

    <footer class="auth-footer">
      <a href="mailto:balsitoyosi07@gmail.com">Contact OnyXLuxe support</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="site-auth.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
